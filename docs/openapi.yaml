openapi: 3.1.0
info:
  title: Let's Cook API
  description: |
    REST API powering a cooking recipe platform. Supports user authentication, recipe management, comments, and user ratings.
  version: 1.0.0
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Recipes
  - name: Images
  - name: Comments
  - name: Users
  - name: Authentication
paths:
  /recipes:
    get:
      tags:
        - Recipes
      operationId: getRecipes
      summary: Get recipes
      parameters:
        - name: search
          in: query
          description: Search by title, description or ingredients
          schema:
            type: string

        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - newest
              - rating
              - prepTimeMin

        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc

        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1

        - name: pageSize
          in: query
          schema:
            type: integer
            default: 12
            minimum: 1

        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 10

        - name: maxPrepTimeMin
          in: query
          schema:
            type: integer
            minimum: 1

      responses:
        "200":
          description: Recipes successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSummaryList"

        "400":
          description: Invalid query parameters

        "500":
          description: Internal server error

    post:
      tags:
        - Recipes
      operationId: createRecipe
      summary: Create a recipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateRequest"

      responses:
        "201":
          description: Recipe successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetails"

        "400":
          description: Invalid request

        "401":
          description: Authentication required

        "500":
          description: Internal server error

  /recipes/{id}:
    get:
      tags:
        - Recipes
      operationId: getRecipeById
      summary: Get recipe details
      parameters:
        - name: id
          in: path
          required: true
          description: Recipe ID
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Recipe successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetails"

        "404":
          description: Recipe not found

        "500":
          description: Internal server error

    put:
      tags:
        - Recipes
      operationId: updateRecipe
      summary: Update a recipe
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Recipe ID
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdateRequest"

      responses:
        "200":
          description: Recipe successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetails"

        "400":
          description: Invalid request

        "401":
          description: Authentication required

        "403":
          description: User is not the recipe owner or an administrator

        "404":
          description: Recipe not found

        "500":
          description: Internal server error

    delete:
      tags:
        - Recipes
      operationId: deleteRecipe
      summary: Delete a recipe
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Recipe ID
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Recipe successfully deleted

        "401":
          description: Authentication required

        "403":
          description: User is not the recipe owner or an administrator

        "404":
          description: Recipe not found

        "500":
          description: Internal server error

  /images:
    post:
      tags:
        - Images
      operationId: uploadImage
      summary: Upload an image
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: User is not authorized to upload images
        "404":
          description: Image not found
        "500":
          description: Internal server error

  /images/{id}:
    get:
      tags:
        - Images
      operationId: downloadImage
      summary: Download image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Image retrieved
        "404":
          description: Image not found
        "500":
          description: Internal server error

    delete:
      tags:
        - Images
      operationId: deleteImage
      summary: Delete an image
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Image deleted successfully
        "401":
          description: Authentication required
        "403":
          description: User is not authorized to delete images
        "404":
          description: Recipe or image not found
        "500":
          description: Internal server error

  /recipes/{recipeId}/comments:
    get:
      tags:
        - Comments
      operationId: getRecipeComments
      summary: Get comments for a recipe
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          description: Recipe not found
        "500":
          description: Internal server error

    post:
      tags:
        - Comments
      operationId: createRecipeComment
      summary: Add a comment and rating to a recipe
      security:
        - BearerAuth: []
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "201":
          description: Comment successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Recipe not found
        "409":
          description: User has already commented on this recipe
        "500":
          description: Internal server error

  /recipes/{recipeId}/comments/{id}:
    get:
      tags:
        - Comments
      operationId: getRecipeComment
      summary: Get a comment
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Comment not found
        "500":
          description: Internal server error

    put:
      tags:
        - Comments
      operationId: updateRecipeComment
      summary: Update a comment and rating
      security:
        - BearerAuth: []
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateRequest"
      responses:
        "200":
          description: Comment successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: User is not the comment owner or an administrator
        "404":
          description: Recipe or comment not found
        "500":
          description: Internal server error

    delete:
      tags:
        - Comments
      operationId: deleteRecipeComment
      summary: Delete a comment and rating
      security:
        - BearerAuth: []
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Comment successfully deleted
        "401":
          description: Authentication required
        "403":
          description: User is not the comment owner or an administrator
        "404":
          description: Recipe or comment not found
        "500":
          description: Internal server error

  /users/{id}:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
        "500":
          description: Internal server error

    put:
      tags:
        - Users
      operationId: updateUser
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User successfully updated
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: User is not the owner or an administrator
        "404":
          description: User not found
        "500":
          description: Internal server error

    delete:
      tags:
        - Users
      operationId: deleteUser
      summary: Delete user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User successfully deleted
        "401":
          description: Authentication required
        "403":
          description: User is not the owner or an administrator
        "404":
          description: User not found
        "500":
          description: Internal server error

  /auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
        "409":
          description: Email already registered
        "500":
          description: Internal server error

  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request
        "401":
          description: Invalid email or password
        "500":
          description: Internal server error

  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutUser
      summary: Log out the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successfully logged out
        "401":
          description: Authentication required
        "500":
          description: Internal server error

components:
  schemas:
    RecipeSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        image:
          $ref: "#/components/schemas/Image"
        prepTimeMin:
          type: integer
        servings:
          type: integer
        difficulty:
          type: integer
        ratingAvg:
          type: number
          format: float
        ratingCount:
          type: integer
        author:
          $ref: "#/components/schemas/UserSummary"

    RecipeSummaryList:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
        - recipes
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"

    RecipeDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        prepTimeMin:
          type: integer
        servings:
          type: integer
        difficulty:
          type: integer
        ratingAvg:
          type: number
          format: float
        ratingCount:
          type: integer
        author:
          $ref: "#/components/schemas/UserSummary"
        description:
          type: string
        ingredients:
          type: string
        instructions:
          type: string
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RecipeCreateRequest:
      type: object
      required:
        - title
        - prepTimeMin
        - servings
        - difficulty
        - description
        - ingredients
        - instructions
      properties:
        title:
          type: string
        prepTimeMin:
          type: integer
        servings:
          type: integer
        difficulty:
          type: integer
        description:
          type: string
        ingredients:
          type: string
        instructions:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/RecipeImageRequest"

    RecipeUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/RecipeCreateRequest"

    RecipeImageRequest:
      type: object
      required:
        - imageId
      properties:
        imageId:
          type: string
          format: uuid
        displayOrder:
          type: integer

    Comment:
      type: object
      required:
        - id
        - recipeId
        - authorId
        - body
        - rating
      properties:
        id:
          type: string
          format: uuid
        recipeId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        rating:
          type: integer

    CommentCreateRequest:
      type: object
      required:
        - body
        - rating
      properties:
        body:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 10

    CommentUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/CommentCreateRequest"

    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    User:
      type: object
      required:
        - id
        - displayName
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - user
            - admin

    UpdateUserRequest:
      allOf:
        - $ref: "#/components/schemas/RegisterRequest"

    RegisterRequest:
      type: object
      required:
        - displayName
        - email
        - password
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    SuccessResponse:
      type: object
      required:
        - code
        - status
        - data
      properties:
        code:
          type: integer
        status:
          type: string
          enum:
            - success

    UserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"

    Error:
      type: object
      required:
        - code
        - status
        - error
      properties:
        code:
          type: integer
        status:
          type: string
          enum:
            - error
        error:
          type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
