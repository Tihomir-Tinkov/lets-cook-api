# TODO: validate parameters

openapi: 3.1.0
info:
  title: Let's Cook API
  description: |
    REST API powering a cooking recipe platform. Supports user authentication, recipe management, comments, and user ratings.
  version: 1.0.0
  license:
    name: GNU Affero General Public License v3.0 or later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:8080/api
    description: Local development
tags:
  - name: Recipes
  - name: Images
  - name: Comments
  - name: Users
  - name: Authentication
security:
  - BearerAuth: []
paths:
  /recipes:
    get:
      tags:
        - Recipes
      operationId: listRecipes
      summary: List recipes
      security: []
      parameters:
        - name: search
          in: query
          description: Search by title, description or ingredients
          schema:
            type: string

        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - newest
              - rating
              - timeMinutes

        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc

        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1

        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 12
            minimum: 1

        - name: minRating
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 5

        - name: maxTimeMinutes
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1

      responses:
        "200":
          description: Recipes successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Recipes
      operationId: createRecipe
      summary: Create a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateRequest"

      responses:
        "201":
          description: Recipe successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      tags:
        - Recipes
      operationId: getRecipeById
      summary: Get recipe details
      security: []

      responses:
        "200":
          description: Recipe successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Recipes
      operationId: updateRecipe
      summary: Update recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdateRequest"

      responses:
        "200":
          description: Recipe successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Recipes
      operationId: deleteRecipe
      summary: Delete recipe

      responses:
        "204":
          description: Recipe successfully deleted

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /images:
    post:
      tags:
        - Images
      operationId: uploadImage
      summary: Upload an image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /images/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      tags:
        - Images
      operationId: downloadImage
      summary: Retrieve image
      security: []
      responses:
        "200":
          description: Image retrieved
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Images
      operationId: deleteImage
      summary: Delete image
      responses:
        "204":
          description: Image deleted successfully

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /recipes/{recipeId}/comments:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      
    get:
      tags:
        - Comments
      operationId: listRecipeComments
      summary: Get comments for a recipe
      security: []
      responses:
        "200":
          description: Comments successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Comments
      operationId: createRecipeComment
      summary: Add a comment and rating to a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "201":
          description: Comment successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          $ref: "#/components/responses/Conflict"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /recipes/{recipeId}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/RecipeId"
      
    get:
      tags:
        - Comments
      operationId: getRecipeCommentById
      summary: Get a comment
      security: []
      responses:
        "200":
          description: Comment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Comments
      operationId: updateRecipeComment
      summary: Update a comment and rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateRequest"
      responses:
        "200":
          description: Comment successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Comments
      operationId: deleteRecipeComment
      summary: Delete a comment and rating
      responses:
        "204":
          description: Comment successfully deleted

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      tags:
        - Users
      operationId: getUserById
      summary: Get user profile
      security: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Users
      operationId: updateUser
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Users
      operationId: deleteUser
      summary: Delete user profile
      responses:
        "204":
          description: User successfully deleted

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "409":
          $ref: "#/components/responses/Conflict"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutUser
      summary: Log out the current user
      responses:
        "200":
          description: Successfully logged out

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Recipe:
      type: object
      required:
        - id
        - authorId
        - title
        - description
        - ingredients
        - instructions
        - timeMinutes
        - difficulty
        - servings
        - ratingAvg
        - ratingCount
        - images
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        ingredients:
          type: string
        instructions:
          type: string
        timeMinutes:
          type: integer
          format: int32
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
        servings:
          type: integer
          format: int32
        ratingAvg:
          type: number
          format: double
          minimum: 0
          maximum: 5
        ratingCount:
          type: integer
          format: int32
        images:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeImage"

    RecipeSummary:
      type: object
      required:
        - id
        - authorId
        - title
        - timeMinutes
        - difficulty
        - servings
        - ratingAvg
        - ratingCount
        - images
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
        timeMinutes:
          type: integer
          format: int32
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
        servings:
          type: integer
          format: int32
        ratingAvg:
          type: number
          format: double
          minimum: 0
          maximum: 5
        ratingCount:
          type: integer
          format: int32
        images:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/RecipeImage"

    RecipeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/Recipe"

    RecipeListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - limit
                - page
                - totalItems
                - totalPages
                - recipes
              properties:
                limit:
                  type: integer
                  format: int32
                page:
                  type: integer
                  format: int32
                totalItems:
                  type: integer
                  format: int32
                totalPages:
                  type: integer
                  format: int32
                recipes:
                  type: array
                  items:
                    $ref: "#/components/schemas/RecipeSummary"

    RecipeCreateRequest:
      type: object
      required:
        - title
        - description
        - ingredients
        - instructions
        - timeMinutes
        - difficulty
        - servings
        - images
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        ingredients:
          type: string
        instructions:
          type: string
        timeMinutes:
          type: integer
          format: int32
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
        servings:
          type: integer
          format: int32
        images:
          type: array
          items:
            $ref: "#/components/schemas/RecipeImageRequest"

    RecipeUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/RecipeCreateRequest"

    Image:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid

    RecipeImage:
      type: object
      required:
        - imageId
        - url
        - displayOrder
      properties:
        imageId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        displayOrder:
          type: integer
          format: int32

    RecipeImageRequest:
      type: object
      required:
        - imageId
        - displayOrder
      properties:
        imageId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          format: int32

    ImageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/Image"

    Comment:
      type: object
      required:
        - id
        - recipeId
        - authorId
        - content
        - rating
      properties:
        id:
          type: string
          format: uuid
        recipeId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
        rating:
          type: integer
          format: int32

    CommentCreateRequest:
      type: object
      required:
        - content
        - rating
      properties:
        content:
          type: string
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5

    CommentUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/CommentCreateRequest"

    CommentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/Comment"

    CommentListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Comment"

    User:
      type: object
      required:
        - id
        - displayName
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - user
            - admin

    UserUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/RegisterRequest"

    UserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required:
        - displayName
        - email
        - password
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - token
                - user
              properties:
                user:
                  $ref: "#/components/schemas/User"
                token:
                  type: string
                  description: JWT access token

    SuccessResponse:
      type: object
      required:
        - code
        - status
      properties:
        code:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - success

    ErrorResponse:
      type: object
      required:
        - code
        - status
        - error
      properties:
        code:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - error
        error:
          type: string

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string
        format: uuid

    RecipeId:
      name: recipeId
      in: path
      required: true
      description: Recipe identifier
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
